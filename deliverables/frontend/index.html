<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>青禾志愿 · 高保真原型（三端）</title>
<style>
:root{
  --primary:#3B82F6; --primary-600:#2563EB; --primary-700:#1D4ED8;
  --primary-50:#EFF6FF; --primary-100:#DBEAFE;
  --success:#10B981; --success-50:#ECFDF5; --success-600:#059669;
  --warning:#F59E0B; --warning-50:#FFFBEB;
  --danger:#EF4444; --danger-50:#FEF2F2; --danger-600:#DC2626;
  --purple:#8B5CF6; --purple-50:#F5F3FF;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB;
  --gray-300:#D1D5DB; --gray-400:#9CA3AF; --gray-500:#6B7280;
  --gray-700:#374151; --gray-900:#111827;
  --bg:#EEF1F6; --card:#FFFFFF;
  --radius:16px; --radius-sm:12px;
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 6px 20px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",sans-serif;
  background:
    radial-gradient(1200px 800px at 85% -10%, rgba(59,130,246,.14), transparent 55%),
    radial-gradient(900px 700px at -10% 110%, rgba(139,92,246,.12), transparent 50%),
    #0B1120;
  color:var(--gray-900);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden;
}
/* ---------- 桌面外层 ---------- */
.app-shell{display:flex; gap:24px; align-items:stretch; height:100vh; padding:24px; max-width:1280px; margin:0 auto; width:100%;}
/* 侧栏 */
.sidebar{
  width:280px; flex:none; background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08); border-radius:20px;
  backdrop-filter:blur(10px); display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-head{padding:20px 20px 14px;}
.sidebar-head .logo{display:flex; align-items:center; gap:10px;}
.sidebar-head .logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;}
.sidebar-head h1{font-size:16px;color:#fff;font-weight:700;letter-spacing:.5px;}
.sidebar-head p{font-size:12px;color:#94A3B8;margin-top:3px;}
.role-switch{display:flex;gap:6px;padding:0 20px 14px;}
.role-switch button{
  flex:1; padding:8px 0; border-radius:9px; border:1px solid rgba(255,255,255,.1);
  background:transparent; color:#CBD5E1; font-size:12px; cursor:pointer; transition:.15s; font-family:inherit;
}
.role-switch button.active{background:#fff; color:#0B1120; font-weight:600;}
.screen-list{flex:1; overflow-y:auto; padding:4px 12px 16px;}
.screen-list::-webkit-scrollbar{width:6px;}
.screen-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:3px;}
.group-label{font-size:11px; color:#64748B; text-transform:uppercase; letter-spacing:1px; padding:14px 8px 6px; font-weight:700;}
.screen-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 10px; margin:2px 0; border-radius:10px; border:none; background:transparent;
  color:#CBD5E1; font-size:13px; cursor:pointer; transition:.12s; font-family:inherit;
}
.screen-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.screen-item.active{background:rgba(59,130,246,.18); color:#fff;}
.screen-item .num{font-size:11px; color:#64748B; width:20px; font-variant-numeric:tabular-nums;}
.screen-item.active .num{color:#93C5FD;}
.screen-item .dot{width:6px;height:6px;border-radius:50%;flex:none;}

/* 舞台 + 手机 */
.stage{flex:1; display:flex; align-items:center; justify-content:center; min-width:0;}
.phone{
  width:390px; height:844px; flex:none; background:var(--bg);
  border-radius:48px; box-shadow:var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.08);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
}
.phone::before{content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%);
  width:120px; height:28px; background:#0B1120; border-radius:0 0 16px 16px; z-index:60;}
/* 状态栏 */
.statusbar{
  height:44px; flex:none; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px 0 30px; font-size:13px; font-weight:600; color:var(--gray-900); z-index:50;
  padding-top:8px;
}
.statusbar .sb-right{display:flex; gap:5px; align-items:center;}
.sb-right svg{width:16px;height:16px;}
/* 顶栏 */
.appbar{
  height:52px; flex:none; display:flex; align-items:center; gap:10px; padding:0 16px;
  position:relative; z-index:50;
}
.appbar .back{
  width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--gray-200);
  display:grid;place-items:center;cursor:pointer;color:var(--gray-700); transition:.12s; flex:none;
}
.appbar .back:hover{background:var(--gray-100);}
.appbar .back svg{width:19px;height:19px;}
.appbar .title{font-size:17px; font-weight:700; flex:1;}
.appbar .ap-action{display:flex; gap:8px;}
.icon-btn{
  width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--gray-200);
  display:grid;place-items:center;cursor:pointer;color:var(--gray-700); position:relative;
}
.icon-btn svg{width:19px;height:19px;}
.icon-btn .badge{position:absolute; top:-3px; right:-3px; width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:700;}
/* 内容区 */
.screen-container{flex:1; overflow:hidden; position:relative;}
.screen{
  position:absolute; inset:0; overflow-y:auto; padding:0 16px 20px;
  display:none; animation:fade .22s ease;
}
.screen.active{display:block;}
.screen::-webkit-scrollbar{display:none;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
/* 底栏 */
.tabbar{
  height:64px; flex:none; background:var(--card); border-top:1px solid var(--gray-200);
  display:flex; align-items:center; padding:6px 8px; z-index:50;
  padding-bottom:12px;
}
.tabbar .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--gray-400); font-size:10px; cursor:pointer; background:none; border:none; font-family:inherit;}
.tabbar .tab svg{width:22px;height:22px;}
.tabbar .tab.active{color:var(--primary); font-weight:600;}
.fab{
  width:52px;height:52px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--primary-600));
  color:#fff; display:grid; place-items:center; cursor:pointer; box-shadow:0 10px 24px rgba(59,130,246,.4);
  position:absolute; right:18px; bottom:80px; z-index:55; border:none;
}
.fab svg{width:26px;height:26px;}
.fab:active{transform:scale(.95);}

/* ---------- 通用组件 ---------- */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:12px;}
.row{display:flex; align-items:center;}
.grow{flex:1;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;}
.muted{color:var(--gray-500); font-size:12px;}
.small{font-size:12px;} .xs{font-size:11px;}
.bold{font-weight:700;} .semibold{font-weight:600;}
.section-title{font-size:15px; font-weight:700; margin:18px 2px 10px; display:flex; align-items:center; gap:8px;}
.section-title .more{margin-left:auto; font-size:12px; color:var(--gray-400); font-weight:400; cursor:pointer;}
/* 标签 */
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; line-height:1.5;}
.tag.blue{background:var(--primary-50); color:var(--primary-600);}
.tag.green{background:var(--success-50); color:var(--success-600);}
.tag.orange{background:var(--warning-50); color:var(--warning);}
.tag.red{background:var(--danger-50); color:var(--danger-600);}
.tag.purple{background:var(--purple-50); color:var(--purple);}
.tag.gray{background:var(--gray-100); color:var(--gray-500);}
.dot-tag{display:inline-flex; align-items:center; gap:5px; font-size:12px;}
.dot-tag::before{content:""; width:7px;height:7px;border-radius:50%; background:currentColor;}
/* 按钮 */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; border:none; font-family:inherit; transition:.15s;}
.btn svg{width:17px;height:17px;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-600)); color:#fff; box-shadow:0 8px 18px rgba(59,130,246,.3);}
.btn-primary:active{transform:scale(.98);}
.btn-ghost{background:var(--card); color:var(--gray-700); border:1px solid var(--gray-200);}
.btn-soft{background:var(--primary-50); color:var(--primary-600);}
.btn-danger{background:var(--danger); color:#fff; box-shadow:0 8px 18px rgba(239,68,68,.3);}
.btn-outline-danger{background:#fff; color:var(--danger-600); border:1px solid #FECACA;}
.btn-link-danger{background:none; border:none; padding:6px 8px; color:var(--danger-600); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;}
.btn-block{width:100%;}
.btn-lg{padding:14px 16px; font-size:15px;}
/* 认证页（登录 / 注册） */
.auth-wrap{min-height:100%; display:flex; flex-direction:column; padding:30px 20px 24px;}
.auth-brand{text-align:center; margin:10px 0 30px;}
.auth-logo{width:66px;height:66px;border-radius:19px; background:linear-gradient(135deg,#3B82F6,#8B5CF6); color:#fff; font-size:30px; font-weight:800; display:grid; place-items:center; margin:0 auto 14px; box-shadow:0 10px 26px rgba(59,130,246,.35);}
.auth-title{font-size:22px; font-weight:800; color:var(--gray-900); letter-spacing:.5px;}
.auth-sub{font-size:13px; color:var(--gray-500); margin-top:6px;}
.auth-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 18px 18px;}
.auth-link{text-align:center; font-size:13px; color:var(--gray-500); margin-top:18px;}
.auth-link a{color:var(--primary-600); font-weight:600; cursor:pointer;}
.auth-foot{text-align:center; margin-top:auto; padding-top:22px;}
.auth-foot button{background:none; border:none; color:var(--gray-400); font-size:12px; cursor:pointer; font-family:inherit; text-decoration:underline;}
.auth-tip{margin-top:16px; padding:10px 12px; background:var(--primary-50); border-radius:10px; font-size:12px; color:var(--primary-700); line-height:1.7;}
.pwd-wrap{position:relative;}
.pwd-eye{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px;height:32px; border:none; background:none; cursor:pointer; color:var(--gray-400); display:grid; place-items:center;}
.pwd-eye svg{width:18px;height:18px;}
.role-tabs{display:flex; gap:8px; margin-bottom:18px;}
.role-tab{flex:1; padding:9px 0; border-radius:11px; border:1.5px solid var(--gray-200); background:#fff; color:var(--gray-500); font-size:13px; font-weight:600; cursor:pointer; transition:.15s; font-family:inherit;}
.role-tab.active{border-color:var(--primary); background:var(--primary-50); color:var(--primary-600);}
/* 输入 */
.field{margin-bottom:14px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--gray-700); margin-bottom:7px;}
.field label .req{color:var(--danger); margin-left:2px;}
.field label .hint{font-weight:400; color:var(--gray-400); font-size:11px;}
.input{width:100%; padding:12px 14px; border:1px solid var(--gray-200); border-radius:12px; font-size:14px; font-family:inherit; background:var(--gray-50); color:var(--gray-900); transition:.15s;}
.input:focus{outline:none; border-color:var(--primary); background:#fff; box-shadow:0 0 0 3px var(--primary-50);}
textarea.input{resize:none; min-height:88px;}
.select-wrap{position:relative;}
.select-wrap select{appearance:none; -webkit-appearance:none; padding-right:36px;}
.select-wrap::after{content:""; position:absolute; right:16px; top:50%; width:8px;height:8px; border-right:2px solid var(--gray-400); border-bottom:2px solid var(--gray-400); transform:translateY(-70%) rotate(45deg); pointer-events:none;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:7px 13px; border-radius:999px; border:1px solid var(--gray-200); background:#fff; font-size:13px; color:var(--gray-500); cursor:pointer; transition:.12s; font-family:inherit;}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600;}
.chip.checked{background:var(--primary-50); border-color:var(--primary); color:var(--primary-600);}
/* 进度条 */
.progress{height:7px; border-radius:99px; background:var(--gray-100); overflow:hidden;}
.progress i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--primary),#60A5FA); transition:.4s;}
.progress.warn i{background:linear-gradient(90deg,var(--warning),#FBBF24);}
.progress.full i{background:var(--success);}
/* 头像 */
.avatar{width:42px;height:42px;border-radius:13px; display:grid; place-items:center; font-weight:700; font-size:15px; color:#fff; flex:none;}
/* 列表项 */
.list-item{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--gray-100);}
.list-item:last-child{border-bottom:none;}
/* 选择框 */
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--gray-300);display:grid;place-items:center;color:#fff;flex:none;cursor:pointer;transition:.15s;background:#fff;}
.cb svg{width:13px;height:13px;opacity:0;}
.cb.on{background:var(--primary);border-color:var(--primary);}
.cb.on svg{opacity:1;}
.cb-all{width:20px;height:20px;border-radius:6px;border:2px solid var(--gray-300);display:grid;place-items:center;color:#fff;flex:none;cursor:pointer;transition:.15s;background:#fff;}
.cb-all svg{width:12px;height:12px;opacity:0;}
.cb-all.on{background:var(--primary);border-color:var(--primary);}
.cb-all.on svg{opacity:1;}
/* 提示条 */
.notice{display:flex; gap:10px; padding:12px; border-radius:12px; font-size:13px; line-height:1.5; margin-bottom:12px;}
.notice svg{width:18px;height:18px; flex:none; margin-top:1px;}
.notice.warn{background:var(--warning-50); color:#92400E;}
.notice.danger{background:var(--danger-50); color:#991B1B;}
.notice.info{background:var(--primary-50); color:var(--primary-700);}
.notice.success{background:var(--success-50); color:var(--success-600);}
/* 分隔 */
.divider{height:1px; background:var(--gray-100); margin:12px 0;}
/* 空态/统计 */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-box{background:var(--card); border-radius:var(--radius-sm); padding:14px; box-shadow:var(--shadow);}
.stat-box .v{font-size:22px; font-weight:800; letter-spacing:-.5px;}
.stat-box .k{font-size:12px; color:var(--gray-500); margin-top:2px;}
/* 弹窗 */
.modal-mask{position:absolute; inset:0; background:rgba(15,23,42,.5); z-index:80; display:none; align-items:center; justify-content:center; padding:24px; backdrop-filter:blur(2px);}
.modal-mask.show{display:flex;}
.modal{background:#fff; border-radius:20px; width:100%; padding:22px; box-shadow:var(--shadow-lg); animation:pop .2s ease;}
@keyframes pop{from{transform:scale(.92); opacity:0;} to{transform:scale(1); opacity:1;}}
.modal h3{font-size:16px; font-weight:700; text-align:center;}
.modal .modal-icon{width:52px;height:52px;border-radius:16px; display:grid; place-items:center; margin:0 auto 14px;}
.modal .modal-icon svg{width:28px;height:28px;}
.modal .modal-body{font-size:14px; color:var(--gray-500); text-align:center; line-height:1.6; margin:10px 0 20px;}
.modal .modal-body strong{color:var(--gray-900);}
.modal .modal-actions{display:flex; gap:10px;}
.modal .modal-actions .btn{flex:1;}
/* Toast */
.toast{
  position:absolute; left:50%; top:70px; transform:translateX(-50%); z-index:100;
  background:var(--gray-900); color:#fff; padding:10px 18px; border-radius:99px; font-size:13px;
  box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:.25s; white-space:nowrap;
}
.toast.show{opacity:1; top:82px;}
.toast.success{background:var(--success-600);}
.toast.danger{background:var(--danger);}
/* 响应式 */
@media (max-width:900px){
  .sidebar{display:none;}
  body{padding:0;}
  .app-shell{padding:0; height:100dvh; gap:0;}
  .stage{height:100%;}
  .phone{width:100%; height:100%; border-radius:0; max-width:100%;}
  .phone::before{display:none;}
  .statusbar{height:36px; padding-top:6px;}
}
/* 筛选面板（底部抽屉） */
.sheet-mask{position:absolute; inset:0; background:rgba(15,23,42,.5); z-index:85; display:none; align-items:flex-end; backdrop-filter:blur(2px);}
.sheet-mask.show{display:flex;}
.sheet{background:#fff; width:100%; border-radius:24px 24px 0 0; max-height:84%; display:flex; flex-direction:column; animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(100%);} to{transform:none;}}
.sheet-head{display:flex; align-items:center; padding:18px 20px 12px; border-bottom:1px solid var(--gray-100);}
.sheet-head .t{font-size:17px; font-weight:700; flex:1;}
.sheet-head .reset{font-size:13px; color:var(--gray-400); background:none; border:none; cursor:pointer; padding:4px 8px;}
.sheet-head .close{width:30px;height:30px;border-radius:9px;background:var(--gray-100);border:none;color:var(--gray-500);display:grid;place-items:center;cursor:pointer; flex:none;}
.sheet-head .close svg{width:18px;height:18px;}
.sheet-body{overflow-y:auto; padding:6px 20px 8px;}
.f-group{padding:14px 0; border-bottom:1px solid var(--gray-100);}
.f-group:last-child{border-bottom:none;}
.f-label{font-size:14px; font-weight:700; color:var(--gray-700); margin-bottom:12px;}
.sheet-foot{padding:12px 20px 20px; border-top:1px solid var(--gray-100);}
/* 筛选标签 */
.filter-tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
.ftag{display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px; background:var(--primary-50); color:var(--primary-600); font-size:12px; font-weight:600; cursor:pointer;}
.ftag b{font-weight:800; font-size:15px; line-height:1;}
/* 空态 */
.empty-state{text-align:center; padding:48px 20px; color:var(--gray-400);}
.empty-ico{width:64px;height:64px;border-radius:20px;background:var(--gray-100);display:grid;place-items:center;margin:0 auto 16px;color:var(--gray-300);}
.empty-ico svg{width:28px;height:28px;}
.ds-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:8px;font-weight:600;line-height:1.4;margin-top:10px;}
.ds-badge.ok{background:rgba(16,185,129,.16);color:#34D399;}
.ds-badge.warn{background:rgba(245,158,11,.16);color:#FBBF24;}
/* 岗位标签 */
.pos-tag{display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:10px; background:var(--primary-50); color:var(--primary-600); font-size:13px; font-weight:600;}
.pos-tag b{width:16px;height:16px;border-radius:50%; background:rgba(37,99,235,.15); display:grid; place-items:center; cursor:pointer; font-weight:800; line-height:1; font-size:13px;}
/* 端切换（居中凸起按钮） */
.switch-fab{
  width:52px; height:52px; border-radius:50%;
  background:linear-gradient(135deg,#3B82F6,#8B5CF6);
  color:#fff; display:grid; place-items:center;
  flex:none; cursor:pointer; border:4px solid var(--card);
  margin-top:-22px;
  box-shadow:0 8px 20px rgba(59,130,246,.45);
  transition:.15s;
}
.switch-fab:active{transform:scale(.92);}
.switch-fab svg{width:24px;height:24px;}
.role-option{display:flex; align-items:center; gap:14px; padding:14px; border-radius:14px; cursor:pointer; margin-bottom:10px; border:1.5px solid var(--gray-200); background:#fff; transition:.15s;}
.role-option.active{border-color:var(--primary); background:var(--primary-50);}
.ro-icon{width:44px;height:44px;border-radius:13px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:18px; background:linear-gradient(135deg,var(--c),rgba(0,0,0,.2)); flex:none;}
.ro-info{flex:1;}
.ro-name{font-size:15px; font-weight:700; color:var(--gray-900);}
.ro-desc{font-size:12px; color:var(--gray-500); margin-top:3px;}
.ro-check{width:20px;height:20px;color:var(--primary); flex:none; display:none;}
.role-option.active .ro-check{display:block;}
.role-logout{display:flex; align-items:center; justify-content:center; gap:7px; padding:13px; border-radius:14px; cursor:pointer; border:1.5px solid #FECACA; background:#FFF5F5; color:var(--danger-600); font-size:14px; font-weight:600; transition:.15s;}
.role-logout svg{width:18px;height:18px;}
.role-logout:active{transform:scale(.98);}

/* ===== 按钮点击动效：涟漪 + 按压反馈 ===== */
.btn, .chip, .role-tab, .tabbar .tab, .back, .fab{position:relative; overflow:hidden;}
.icon-btn{position:relative;}
.icon-btn, .tabbar .tab{transition:transform .15s;}
.ripple{position:absolute; border-radius:50%; background:rgba(59,130,246,.18); transform:scale(0); animation:ripple .6s ease-out; pointer-events:none;}
.ripple.light{background:rgba(255,255,255,.45);}
@keyframes ripple{to{transform:scale(1); opacity:0;}}
.btn:active, .chip:active, .role-tab:active, .back:active, .fab:active, .role-logout:active{transform:scale(.96);}
.icon-btn:active, .tabbar .tab:active{transform:scale(.88);}

/* ================= 图标 & 通用助手 ================= */
const ic = (id, cls='') => `<svg class="${cls}" width="18" height="18"><use href="#${id}"/></svg>`;
const tag = (label, type) => `<span class="tag ${type}">${label}</span>`;
const statusTag = s => s ? tag(s.label, s.type) : '';
const avatar = (initial, gradient) => `<div class="avatar" style="background:linear-gradient(135deg,${gradient});">${initial}</div>`;

function activityCard(a){
  const badge = a.badge ? `<span class="tag" style="position:absolute; left:12px; top:12px; background:rgba(255,255,255,.92); color:var(--${a.badge.color});">${a.badge.label}</span>` : '';
  const remain = a.recruit - a.signed;
  const statusHtml = a.full ? `<span class="tag orange">已满员</span>` : `<span class="xs" style="color:var(--primary-600); font-weight:600;">${remain} 个名额</span>`;
  const pct = Math.round(a.signed / a.recruit * 100);
  return `
<div class="card" style="padding:0; overflow:hidden; cursor:pointer;" onclick="openActivity('${a.id}')">
  <div style="height:110px; background:linear-gradient(135deg,${a.gradient}); position:relative;">
    ${badge}
    <span class="tag" style="position:absolute; right:12px; top:12px; background:rgba(17,24,39,.35); color:#fff;">${a.scope}</span>
  </div>
  <div style="padding:14px;">
    <div class="row"><span class="semibold" style="font-size:15px;">${a.title}</span></div>
    <div class="muted mt8" style="display:flex; align-items:center; gap:4px;">${ic('i-users','')} ${a.org} · 招募 ${a.recruit} 人</div>
    <div class="row mt8" style="gap:12px;">
      <span class="dot-tag small" style="color:var(--gray-500)"><svg width="13" height="13" style="color:var(--gray-400)"><use href="#i-calendar"/></svg>${a.time}</span>
      <span class="dot-tag small" style="color:var(--gray-500);"><svg width="13" height="13" style="color:var(--gray-400)"><use href="#i-pin"/></svg>${a.location}</span>
    </div>
    <div class="mt12">
      <div class="row" style="justify-content:space-between; margin-bottom:6px;">
        <span class="xs muted">已报名 ${a.signed} / ${a.recruit}</span>${statusHtml}
      </div>
      <div class="${a.full ? 'progress full' : 'progress'}"><i style="width:${pct}%"></i></div>
    </div>
  </div>
</div>`;
}

let filterState = { time:'all', place:'all', category:'all', status:'all' };
let searchQuery = '';

function openFilter(){
  updateResultCount();
  document.getElementById('filterMask').classList.add('show');
}
function closeFilter(){
  document.getElementById('filterMask').classList.remove('show');
}
function setFilter(el){
  const key = el.dataset.f;
  const val = el.dataset.v;
  filterState[key] = val;
  const group = el.parentElement;
  group.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderActivityList();
  updateFilterBadge();
  updateFilterTags();
  updateResultCount();
}
function resetFilters(){
  filterState = { time:'all', place:'all', category:'all', status:'all' };
  const mask = document.getElementById('filterMask');
  mask.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.v === 'all'));
  const si = document.querySelector('#s1 input');
  if (si) si.value = '';
  searchQuery = '';
  renderActivityList();
  updateFilterBadge();
  updateFilterTags();
  updateResultCount();
}
function searchActivities(v){
  searchQuery = (v || '').trim().toLowerCase();
  renderActivityList();
  updateResultCount();
}
function matchesTime(a){
  if (filterState.time === 'all') return true;
  const p = TIME_PRESETS[filterState.time];
  if (!p || !a.date) return true;
  return a.date >= p.start && a.date <= p.end;
}
function filterActivities(){
  return DATA.activities.filter(a => {
    if (searchQuery && !(a.title + a.org + a.location).toLowerCase().includes(searchQuery)) return false;
    if (filterState.place === 'inside' && a.scope !== '校内') return false;
    if (filterState.place === 'outside' && a.scope !== '校外') return false;
    if (filterState.category !== 'all' && a.category !== filterState.category) return false;
    if (filterState.status === 'available' && a.full) return false;
    if (filterState.status === 'full' && !a.full) return false;
    if (!matchesTime(a)) return false;
    return true;
  });
}
function renderActivityList(){
  const box = document.getElementById('activityList');
  const empty = document.getElementById('emptyState');
  if (!box) return;
  const list = filterActivities();
  box.innerHTML = list.map(activityCard).join('');
  if (empty) empty.style.display = list.length ? 'none' : 'block';
}
function activeFilterCount(){
  let n = 0;
  if (filterState.time !== 'all') n++;
  if (filterState.place !== 'all') n++;
  if (filterState.category !== 'all') n++;
  if (filterState.status !== 'all') n++;
  return n;
}
function updateFilterBadge(){
  const b = document.getElementById('filterBadge');
  if (!b) return;
  const n = activeFilterCount();
  b.textContent = n;
  b.style.display = n > 0 ? '' : 'none';
}
function updateFilterTags(){
  const box = document.getElementById('filterTags');
  if (!box) return;
  const tags = [];
  if (filterState.time !== 'all') tags.push(['time', TIME_PRESETS[filterState.time] ? TIME_PRESETS[filterState.time].label : filterState.time]);
  if (filterState.place !== 'all') tags.push(['place', filterState.place === 'inside' ? '校内' : '校外']);
  if (filterState.category !== 'all') tags.push(['category', CATEGORY_LABELS[filterState.category] || filterState.category]);
  if (filterState.status !== 'all') tags.push(['status', filterState.status === 'available' ? '可报名' : '已满员']);
  box.innerHTML = tags.map(t => `<span class="ftag" onclick="clearFilter('${t[0]}')">${t[1]} <b>×</b></span>`).join('');
  box.style.display = tags.length ? '' : 'none';
}
function clearFilter(key){
  filterState[key] = 'all';
  const chip = document.querySelector(`#filterMask .chip[data-f="${key}"][data-v="all"]`);
  if (chip) {
    chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  }
  renderActivityList();
  updateFilterBadge();
  updateFilterTags();
  updateResultCount();
}
function updateResultCount(){
  const btn = document.getElementById('filterResultBtn');
  if (btn) btn.textContent = `查看 ${filterActivities().length} 个活动`;

/* ================= 数据加载（data.json 优先，内置兜底） ================= */
function stripJsonComments(str){
  let out = '';
  let inString = false, inLine = false, inBlock = false;
  for (let i = 0; i < str.length; i++) {
    const c = str[i], n = str[i + 1];
    if (inLine) { if (c === '\n') { inLine = false; out += c; } continue; }
    if (inBlock) { if (c === '*' && n === '/') { inBlock = false; i++; } continue; }
    if (inString) { out += c; if (c === '\\') { out += n; i++; } else if (c === '"') { inString = false; } continue; }
    if (c === '"') { inString = true; out += c; }
    else if (c === '/' && n === '/') { inLine = true; i++; }
    else if (c === '/' && n === '*') { inBlock = true; i++; }
    else { out += c; }
  }
  return out;
}

async function loadData(){
  // 1) 读取静态配置 data.json（前端常量：学校、状态色映射、badge 色映射）
  let config = {};
  try {
    const r = await fetch('data.json', {cache:'no-store'});
    if(r.ok) config = JSON.parse(stripJsonComments(await r.text()));
  } catch(e) { /* 静态配置读取失败则使用默认 */ }
  // 2) 读取动态数据（后端 API 返回）
  let data = null;
  try {
    const resp = await fetch('/api/v1/test-data', {cache:'no-store'});
    if(resp.ok){
      const body = await resp.json();
      data = (body && body.data) || null;
    }
  } catch(e) { data = null; }
  if(!data){ window.__dataSource = 'error'; return null; }
  // 3) 合并：把静态配置的字段/映射应用回动态数据
  if(config.school) data.school = config.school;
  applyStaticConfig(data, config);
  window.__dataSource = 'test_data';
  return data;
}

// 递归为动态数据填充「前端常量映射」：status.type、badge.color
function applyStaticConfig(node, config){
  if(Array.isArray(node)){ node.forEach(n => applyStaticConfig(n, config)); return; }
  if(node && typeof node === 'object'){
    if(node.status && node.status.label){
      node.status.type = (config.statusType && config.statusType[node.status.label]) || 'gray';
    }
    if(node.badge && node.badge.label){
      node.badge.color = (config.badgeColor && config.badgeColor[node.badge.label]) || 'primary-600';
    }
    Object.keys(node).forEach(k => applyStaticConfig(node[k], config));
  }
}

function markDataSource(){

/* ================= 按钮点击动效（涟漪） ================= */
function spawnRipple(el, x, y){
  const rect = el.getBoundingClientRect();
  const d = Math.max(rect.width, rect.height) * 1.6;
  const r = document.createElement('span');
  r.className = 'ripple';
  const dark = el.classList.contains('btn-primary') || el.classList.contains('btn-danger') || el.classList.contains('fab');
  if(dark) r.classList.add('light');
  r.style.width = r.style.height = d + 'px';
  r.style.left = (x - rect.left - d / 2) + 'px';
  r.style.top = (y - rect.top - d / 2) + 'px';
  el.appendChild(r);
  setTimeout(() => r.remove(), 650);
}
document.addEventListener('pointerdown', function(e){
  const el = e.target.closest('.btn, .icon-btn, .chip, .role-tab, .tabbar .tab, .back, .fab');
  if(!el) return;
  spawnRipple(el, e.clientX, e.clientY);
});

/* ================= 交互 ================= */
function chip(el){ el.classList.toggle('active'); }
function radioChip(el){
  const row = el.closest('.chip-row') || el.parentElement;
  row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
function filterChip(el){
  const row = el.closest('.chip-row') || el.parentElement;
  const isAll = el.hasAttribute('data-all');
  if (isAll) {
    row.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.hasAttribute('data-all')));
  } else {
    el.classList.toggle('active');
    const all = row.querySelector('.chip[data-all]');
    const others = Array.from(row.querySelectorAll('.chip:not([data-all])'));
    const allSelected = others.every(c => c.classList.contains('active'));
    if (allSelected) {
      all.classList.add('active');
      others.forEach(c => c.classList.remove('active'));
    } else {
      all.classList.remove('active');
    }
  }
}
function switchSign(el, targetId){
  const wrap = el.parentElement;
  wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const root = el.closest('.screen');
  root.querySelectorAll('[id^="sign-"], [id^="out-"]').forEach(n => n.style.display = 'none');
  const t = document.getElementById(targetId);
  if (t) t.style.display = '';
}
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function toggleStudent(el){

function toggleSelectAll(el){
  const screen = el.closest('.screen');
  const on = !el.classList.contains('on');
  screen.querySelectorAll('.student-item .cb').forEach(c => c.classList.toggle('on', on));

function refreshSelection(screen){
  const items = screen.querySelectorAll('.student-item');
  const selected = screen.querySelectorAll('.student-item .cb.on');
  const n = selected.length;
  const all = screen.querySelector('.cb-all');
  if (all) all.classList.toggle('on', n > 0 && n === items.length);

  if (cnt) cnt.textContent = n;
  const selBtn = screen.querySelector('.cert-sel-btn');
  if (selBtn) selBtn.innerHTML = `${ic('i-check')} 认定所选（${n}）`;
}
function setStudentStatus(row, status){
  const t = row.querySelector('.stu-status');
  if(!t) return;
  if(status === 'certified'){

  closeModal();
  const screen = document.querySelector('.screen.active');
  screen.querySelectorAll('.student-item .cb.on').forEach(cb => {
    setStudentStatus(cb.closest('.student-item'), 'pending');

  });

function exportSelected(btn){
  const screen = btn.closest('.screen');
  const rows = Array.from(screen.querySelectorAll('.student-item .cb.on')).map(cb => cb.closest('.student-item'));
  if(!rows.length){ toast('请先选择学生','danger'); return; }
  const header = ['姓名','学号','签到','签退','实际时长(h)'];
  const lines = rows.map(r => [r.dataset.name, r.dataset.id, r.dataset.checkin, r.dataset.checkout, r.dataset.hours].join(','));
  const csv = '\ufeff' + header.join(',') + '\n' + lines.join('\n');
  try {
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '选中学生名单.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  } catch(e){}
  toast('已导出 ' + rows.length + ' 人名单','success');
}

/* ================= 认证（登录 / 注册） ================= */
const AUTH_KEY = 'qh_token';
const USER_KEY = 'qh_user';

async function api(path, method, body){
  try {
    const opts = { method: method || 'GET', headers: { 'Content-Type': 'application/json' } };
    const token = localStorage.getItem(AUTH_KEY);
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    return await r.json();
  } catch (e) {
    return { code: -1, message: '网络错误，请确认后端已启动' };
  }
}

function setAuth(data){
  localStorage.setItem(AUTH_KEY, data.token);
  localStorage.setItem(USER_KEY, JSON.stringify(data.user));
}

function getAuthUser(){
  try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); }
  catch(e){ return null; }
}

function clearAuth(){
  localStorage.removeItem(AUTH_KEY);
  localStorage.removeItem(USER_KEY);
}

function enterByRole(role){
  const map = { student: 'student', publisher_internal: 'publisher', admin: 'admin' };
  switchRole(map[role] || 'student');
}

function togglePwd(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.innerHTML = show ? ic('i-eye-off') : ic('i-eye');
}

/* 身份配置：注册字段 + 登录账号提示 */

  { key:'student', role:'student', label:'学生端',
    loginLabel:'手机号 / 学号', loginPlaceholder:'请输入手机号或学号',
    fields:[
      { id:'regName', label:'姓名', type:'text', placeholder:'请输入姓名', required:false },

      { id:'regPwd', label:'密码', type:'password', placeholder:'至少 6 位', required:true },
    ]},
  { key:'publisher', role:'publisher_internal', label:'发布者端',
    loginLabel:'手机号', loginPlaceholder:'请输入手机号',
    fields:[
      { id:'regName', label:'姓名', type:'text', placeholder:'请输入姓名', required:false },
      { id:'regPhone', label:'手机号', type:'tel', placeholder:'请输入 11 位手机号', required:true },

      { id:'regOrg', label:'所属机构', type:'text', placeholder:'请输入所属机构', required:true },
    ]},
  { key:'admin', role:'admin', label:'校方端',
    loginLabel:'手机号 / 工号', loginPlaceholder:'请输入手机号或工号',
    fields:[
      { id:'regName', label:'姓名', type:'text', placeholder:'请输入姓名', required:false },

      { id:'regPwd', label:'密码', type:'password', placeholder:'至少 6 位', required:true },
      { id:'regOrg', label:'所属单位', type:'text', placeholder:'请输入所属单位', required:true },
      { id:'regWorkerNo', label:'工号', type:'text', placeholder:'请输入工号', required:true },
    ]},
];
let authRoleKey = 'student';

function setAuthRole(key){
  authRoleKey = key;
  document.querySelectorAll('.role-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.roleKey === key);
  });
  updateLoginAccount();
  renderRegFields();
}

function updateLoginAccount(){
  const label = document.getElementById('loginAccountLabel');
  const input = document.getElementById('loginAccount');
  if(!label || !input) return;
  const cfg = AUTH_ROLES.find(r => r.key === authRoleKey);
  label.textContent = cfg.loginLabel;
  input.placeholder = cfg.loginPlaceholder;
}

function renderRegFields(){
  const container = document.getElementById('regFields');
  if(!container) return;
  const cfg = AUTH_ROLES.find(r => r.key === authRoleKey);
  container.innerHTML = cfg.fields.map(f => `
    <div class="field">
      <label>${f.label} ${f.required ? '<span class="req">*</span>' : '<span class="hint">选填</span>'}</label>
      ${f.type === 'password'
        ? `<div class="pwd-wrap"><input class="input" id="${f.id}" type="password" placeholder="${f.placeholder}"><button class="pwd-eye" onclick="togglePwd('${f.id}', this)">${ic('i-eye')}</button></div>`
        : `<input class="input" id="${f.id}" type="${f.type}" ${f.type === 'tel' ? 'maxlength="11" inputmode="numeric"' : ''} placeholder="${f.placeholder}">`}
    </div>`).join('');
}

async function doLogin(){
  const account = (document.getElementById('loginAccount').value || '').trim();
  const password = document.getElementById('loginPwd').value || '';
  if(!account){ toast('请输入账号', 'danger'); return; }
  if(password.length < 6){ toast('密码至少 6 位', 'danger'); return; }
  const r = await api('/api/v1/auth/login', 'POST', { account, password });
  if(r && r.code === 0){
    setAuth(r.data);
    toast('登录成功', 'success');
    setTimeout(() => { enterByRole(r.data.user.role); refreshMyState(); }, 500);
  } else {
    toast((r && r.message) || '登录失败', 'danger');
  }
}

async function doRegister(){
  const cfg = AUTH_ROLES.find(r => r.key === authRoleKey);
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const name = val('regName');
  const phone = val('regPhone');
  const password = val('regPwd');
  const student_no = val('regStudentNo');
  const org = val('regOrg');
  const worker_no = val('regWorkerNo');
  if(!/^1\d{10}$/.test(phone)){ toast('请输入 11 位手机号', 'danger'); return; }
  if(password.length < 6){ toast('密码至少 6 位', 'danger'); return; }
  if(cfg.key === 'student' && !student_no){ toast('请填写学号', 'danger'); return; }
  if(cfg.key === 'publisher' && !org){ toast('请填写所属机构', 'danger'); return; }
  if(cfg.key === 'admin'){
    if(!org){ toast('请填写所属单位', 'danger'); return; }
    if(!worker_no){ toast('请填写工号', 'danger'); return; }
  }
  const r = await api('/api/v1/auth/register', 'POST', { role: cfg.role, phone, password, name, student_no, org, worker_no });
  if(r && r.code === 0){
    setAuth(r.data);
    toast('注册成功，已自动登录', 'success');
    setTimeout(() => { enterByRole(r.data.user.role); refreshMyState(); }, 500);
  } else {
    toast((r && r.message) || '注册失败', 'danger');
  }
}

/* ================= 初始化 ================= */
async function init(){
  DATA = await loadData();
  markDataSource();
  if(!DATA){
    const c = document.getElementById('screenContainer');
    c.innerHTML = '<div style="padding:48px 24px; text-align:center; color:var(--gray-500);"><div style="font-size:15px; font-weight:700; margin-bottom:10px;">数据加载失败</div><div class="muted" style="line-height:1.7;">未能读取后端数据。请在 backend 目录运行 <b>python app.py</b>，通过 http://127.0.0.1:8787/ 访问；不要直接双击打开 HTML 文件。</div></div>';
    return;
  }
  SCREENS = buildScreens(DATA);
  renderScreens();
  renderPositions();
  buildNav();
  renderTabs();
  renderRegFields();
  updateLoginAccount();
  // 登录态判断：已登录则按角色进入对应端，否则显示登录页
  const user = getAuthUser();
  if(user && user.role){
    enterByRole(user.role);
  } else {
    current = 's25';
    updateUI();
  }
  refreshMyState();   // 拉取真实报名/签到状态，驱动「我的活动」与详情按钮
  const d = new Date();
  document.getElementById('sbTime').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
init();
